# ==============================================================================
# FADC500 DAQ 프로그램 (frontend_nkfadc500) 설정 파일
# (Notice Korea NKFADC500-4 Vendor SDK 하드웨어 레지스터 규격 100% 반영)
# ==============================================================================

# [DAQ 기본 파라미터]
RUN_NUMBER     160
BOARD          1         # 장비에 할당된 고유 ID (Serial ID / MID)
SAMPLING_RATE  1         # 분주비 DSR: 1(500MS/s), 2(250MS/s), 4(125MS/s), 8(62.5MS/s)

# [트리거 글로벌 설정]
RECORD_LEN     8         # 2의 거듭제곱 코드 {1,2,4,8,16,32,64,128,256} (1=128ns, 8=1us, 16=2us, ..., 256=32us)
PRESCALE       1         # 트리거 분주비 (1 ~ 65535)
TRIG_TLT       0xAAAA    # Trigger Lookup Table (0xAAAA = Ch0 단독 트리거, 0xFFFE = 4채널 OR 조건)
TRIG_ENABLE    15        # 트리거 소스 활성화 비트마스크 (1:Self, 2:Pedestal, 4:Soft, 8:External; 15=모두 허용)
PTRIG_INT      0         # 페데스탈 강제 트리거 간격 (0 ~ 65535 ms, 0이면 비활성화)
ZERO_SUP       0         # 제로 서프레션 (0: 비활성화 [파형 기록], 1~15: 헤더 전용 패킷 모드)

# ------------------------------------------------------------------------------
# [채널별 개별 설정]
# 값을 1개 쓰면 4채널 일괄 적용, 4개 쓰면 (Ch0 Ch1 Ch2 Ch3) 개별 적용
# ------------------------------------------------------------------------------
# 아날로그 / 타이밍 (주의: 하드웨어 5-bit coarse 레지스터 한계로 CW + DLY <= 31992 ns)
DACOFF    3600           # 12-bit ADC DC 오프셋 (0 ~ 4095)
DLY       400            # 파형 프리트리거 딜레이 (0 ~ 31992 ns)
CW        100            # Coincidence Width (8 ~ 32760 ns)
AMODE     0              # ADC 아날로그 모드 (0: Raw Waveform, 1: Filtered)
POL       0              # 입력 펄스 극성 (0: Negative PMT, 1: Positive)

# 트리거 조건
THR       30 4095 4095 4095  # 문턱값 (Ch0: 30 ADC, 미연결 Ch1~Ch3: 4095 차단)
TMODE     1              # 트리거 모드 비트마스크 (1: Count[ten], 2: Width[tew], 4: PeakSum[tep], 8: PeakSumOR[tep2])
DT        0              # Trigger Deadtime (0 ~ 8355840 ns)
PSW       2              # Peak Sum Width (2 ~ 16382 ns)
PCT       1              # Pulse Count Threshold (1 ~ 15)
PCI       1000           # Pulse Count Interval (32 ~ 8160 ns)
PWT       100            # Pulse Width Threshold (2 ~ 1022 ns)
